[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuttut"
version = "0.0.7"
authors = [
  { name="Nathan Candre", email="nathan.candre@gmail.com" },
]
description = "A package to convert MIDI files to string instrument tabs."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23.2",
    "pretty_midi>=0.2.10",
    "eel>=0.18.2"
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.3", 
    "networkx>=2.8.6"
]
dev = [
    "pytest", 
    "matplotlib>=3.5.3", 
    "networkx>=2.8.6"
]

[project.urls]
Homepage = "https://github.com/natecdr/tuttut"
Issues = "https://github.com/natecdr/tuttut/issues"

[project.scripts]
tuttut = "tuttut.midi_tabs_gui:run"
tuttut-cli = "tuttut.midi_tabs_cli:main"
